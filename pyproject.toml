[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-c-autoresearch"
version = "0.1.0"
description = "Portable tooling for 1C autoresearch repositories."
requires-python = ">=3.11"

[project.scripts]
one-c-autoresearch = "one_c_autoresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/checks"]
