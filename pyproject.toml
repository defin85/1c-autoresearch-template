[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-c-autoresearch"
version = "0.1.0"
description = "Portable tooling for 1C autoresearch repositories."
requires-python = ">=3.11"

[project.optional-dependencies]
workspace = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
one-c-autoresearch = "one_c_autoresearch.cli:main"
one-c-autoresearch-workspace = "one_c_autoresearch.workspace_api:main"

[tool.setuptools.package-data]
one_c_autoresearch = ["workspace_static/**/*", "workspace_assets/*.zip"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/checks"]
pythonpath = ["src"]
