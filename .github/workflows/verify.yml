name: Verify

on:
  push:
  pull_request:

jobs:
  powershell-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test template contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\checks\Test-Template.ps1

      - name: Test doctor smoke scenarios
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\checks\Test-Doctor.ps1

      - name: Run doctor
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\doctor.ps1 -Json -Deep -Strict
