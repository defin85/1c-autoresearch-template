name: Verify

on:
  push:
  pull_request:

jobs:
  python-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Test template contract
        run: python -m one_c_autoresearch checks template

      - name: Test doctor smoke scenarios
        run: python -m one_c_autoresearch checks doctor

      - name: Run doctor
        run: python -m one_c_autoresearch doctor --json --deep --strict
