schema_version = "queue-seeding-profile/v1"
name = "second-pass-v8unpack"
generator = "second-pass-v8unpack"
task_id_prefix = "Q-SP2"
default_type = "review"
default_priority = 80
default_quality_gates = ["source_lines", "metadata_checked", "bsl_checked", "forms_checked", "needs_infobase_data_marked", "review_passed"]

[inputs]
required = ["project.toml", "analysis/subject-cards/registry.csv", "analysis/indexes/diff-inventory.csv"]
optional = ["analysis/indexes/v8unpack-diff-trace.csv", "analysis/reverse-map/unresolved.csv", "analysis/functional-gaps/open-questions.csv", "outputs/infobase-questions.csv"]
