[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-c-autoresearch"
version = "0.3.0"
description = "Portable tooling for 1C autoresearch repositories."
requires-python = ">=3.11"

[project.optional-dependencies]
workspace = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1.0.10,<2", "langgraph-checkpoint-sqlite>=3.1.0,<4"]

[project.scripts]
one-c-autoresearch = "one_c_autoresearch.cli:main"
one-c-autoresearch-workspace = "one_c_autoresearch.workspace_api:main"

[tool.setuptools.package-data]
one_c_autoresearch = ["workspace_static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/checks"]
pythonpath = ["src"]
markers = [
  "smoke: end-to-end tests that require a real codex CLI and active repository state; skipped by default",
]
addopts = "-m 'not smoke'"

[tool.basedpyright]
include = ["src/one_c_autoresearch"]
pythonVersion = "3.11"
baselineFile = ".basedpyright/baseline.json"

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
]
