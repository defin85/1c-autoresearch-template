[project]
id = "example-project"
product = "1C Document Management"
baseline_version = "2.1"
target_version = "2.1"
next_vendor_version = "3.0"
description = "Example project manifest for a concrete 1C research repository."

[paths]
vendor_baseline = "E:/Projects/vendor_baseline"
target_cf = "E:/Projects/customer/cf"
target_cfe = "E:/Projects/customer/cfe"
next_vendor = "E:/Projects/vendor_next"
compare_repo = "."

[source_roles]
vendor = "vendor_baseline"
customer = "target_cf"
target_release = "next_vendor"

[parallel_research]
model = ""
workers = 3
unit_size = 3
timeout_seconds = 1800
comparison_repo = "analysis/cache/noise/clean-rebase-v8unpack/repo"
vendor_ref = "HEAD^"
customer_ref = "HEAD"
vendor_drift_markers = []

[physical_cleanup]
enabled = false
comparison_repo = ""
normalized_repo = "analysis/cache/clean-rebase/repo"
vendor_ref = "HEAD^"
customer_ref = "HEAD"
batch_size = 30
workers = 3

[rlm]
vendor_baseline = "vendor_baseline"
target_cf = "customer_cf"
target_cfe = "customer_cfe"
next_vendor = "vendor_next"

[mcp]
enabled = false
server = ""
url = ""
service_root = "mcp"

[web]
enabled = false
url = ""
username = "codex"
credential_file = ""

[policy]
static_sources_first = true
allow_live_infobase_evidence = false
mark_runtime_data_dependencies = true
default_confidence_for_inference = "medium"

[autopilot]
enabled = false
diff_inventory = "analysis/indexes/diff-inventory.csv"
feature_map = "analysis/indexes/feature-map.csv"
customization_map_md = "outputs/customization-map.md"
customization_map_xlsx = "outputs/customization-map.xlsx"
open_questions_csv = "outputs/open-questions.csv"
open_questions_xlsx = "outputs/open-questions.xlsx"
final_audit = "analysis/final-audit.md"
